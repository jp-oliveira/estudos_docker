services:
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: manocarsystem
    volumes:
      - drupal-data:/var/lib/mysql
      # IMPORTANTE PARA NÃO APAGAR O VOLUME DEPOIS DE FAZER DOCKER COMPOSE DOWN, exceto
      # se for especificado.
  drupal:
    build: .
    # é a mesma coisa que escrever:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: drupal-custom
    ports:
      - "8080:80"
    volumes:
    - drupal-modules:/var/www/html/modules
    - drupal-profiles:/var/www/html/profiles
    - drupal-sites:/var/www/html/sites
    - drupal-themes:/var/www/html/themes

volumes:
  drupal-data:
  drupal-modules:
  drupal-profiles:
  drupal-sites:
  drupal-themes: